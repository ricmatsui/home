---

- name: install
  ansible.builtin.apt:
    name: glusterfs-client

- name: create mount point
  ansible.builtin.file:
    path: /mnt/gluster
    owner: root
    group: root
    state: directory

- name: configure fstab
  ansible.posix.mount:
    path: /mnt/gluster
    src: "{{ groups['gluster_pool_servers']|map('extract', hostvars, 'gluster_ip')|join(',') }}:/gv0"
    fstype: glusterfs
    opts: defaults,_netdev,noatime,x-systemd.automount
    passno: 1
    state: mounted

- name: enable logging
  ansible.builtin.systemd:
    name: gluster-log@mnt-gluster
    enabled: true
    daemon_reload: true
  notify: gluster_client_logging_restart
  tags: gluster_logging

- name: create gluster mount recover script
  ansible.builtin.copy:
    dest: /opt/gluster-mount-recover.sh
    src: gluster-mount-recover.sh
    owner: root
    group: root
    mode: u=rwx,g=rx,o=rx
  notify: gluster_mount_recover_reload
  tags: gluster_mount_recover

- name: configure gluster mount recover service
  ansible.builtin.copy:
    dest: /etc/systemd/system/gluster-mount-recover.service
    content: |
      [Unit]
      Description=Gluster Mount Recovery

      [Service]
      Type=oneshot
      TimeoutStartSec=300
      ExecStart=/opt/gluster-mount-recover.sh
  notify: gluster_mount_recover_reload
  tags: gluster_mount_recover

- name: configure gluster mount recover timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/gluster-mount-recover.timer
    content: |
      [Unit]
      Description=Gluster Mount Recovery

      [Timer]
      OnCalendar=*:0/2
      RandomizedDelaySec=30s

      [Install]
      WantedBy=timers.target
  notify: gluster_mount_recover_reload
  tags: gluster_mount_recover

- name: enable gluster mount recover timer
  ansible.builtin.systemd:
    name: gluster-mount-recover.timer
    enabled: true
    state: started
  tags: gluster_mount_recover
