---

- name: create directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    state: directory
  loop:
    - /etc/docker
    - /etc/systemd/system/docker.service.d
    - /etc/systemd/system/containerd.service.d
  notify: docker_restart

- name: configure
  ansible.builtin.template:
    src: daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
  notify: docker_restart

- name: configure docker slice
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.slice
    content: |
      [Unit]
      Description=Docker Slice
      Before=slices.target

      [Slice]
      CPUAccounting=true
      CPUWeight=idle
      MemoryAccounting=true
      MemoryMax={{ docker_slice_memory_max }}
      IOAccounting=true
      IOWeight=50
  notify: docker_restart

- name: configure services
  ansible.builtin.copy:
    dest: "{{ item }}/override.conf"
    content: |
      [Service]
      Slice=docker.slice
  loop:
    - /etc/systemd/system/docker.service.d
    - /etc/systemd/system/containerd.service.d
  notify: docker_restart

- name: install docker
  ansible.builtin.shell:
    cmd: >
      bash -c "$(curl -fsSL https://get.docker.com)" -- --version 29.1.5
    creates: /usr/bin/docker
  notify: docker_restart

- name: log into registry
  community.docker.docker_login:
    registry_url: "gitea.{{ config.domain }}"
    username: "{{ config.gitea.username }}"
    password: "{{ config.gitea.token }}"
  notify: docker_restart
  tags: docker_login

- name: configure docker prune service
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker-prune.service
    content: |
      [Unit]
      Description=Docker system prune

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker system prune -f
  notify: docker_prune_restart
  tags: docker_prune

- name: configure docker prune timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker-prune.timer
    content: |
      [Unit]
      Description=Run docker system prune monthly

      [Timer]
      OnCalendar=monthly
      Persistent=true
      RandomizedDelaySec=1h

      [Install]
      WantedBy=timers.target
  notify: docker_prune_restart
  tags: docker_prune

- name: enable docker prune timer
  ansible.builtin.systemd:
    name: docker-prune.timer
    enabled: true
  tags: docker_prune

- name: create ipvlan config network
  community.docker.docker_network:
    name: ipvlan-config
    config_only: true
    driver_options:
      parent: "{{ docker_ipvlan_parent }}"
    ipam_config: "{{ config.docker.ipvlan_ipam_config }}"
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python
  tags: docker_ipvlan

- name: create docker network recover script
  ansible.builtin.copy:
    dest: /opt/docker-network-recover.sh
    src: docker-network-recover.sh
    owner: root
    group: root
    mode: u=rwx,g=rx,o=rx
  notify: docker_network_recover_reload
  tags: docker_network_recover

- name: configure docker network recover service
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker-network-recover.service
    content: |
      [Unit]
      Description=Docker Network Recovery

      [Service]
      Type=oneshot
      TimeoutStartSec=120
      ExecStart=/opt/docker-network-recover.sh
  notify: docker_network_recover_reload
  tags: docker_network_recover

- name: configure docker network recover timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker-network-recover.timer
    content: |
      [Unit]
      Description=Docker Network Recovery

      [Timer]
      OnCalendar=*:0/2
      RandomizedDelaySec=30s

      [Install]
      WantedBy=timers.target
  notify: docker_network_recover_reload
  tags: docker_network_recover

- name: enable docker network recover timer
  ansible.builtin.systemd:
    name: docker-network-recover.timer
    enabled: true
    state: started
  tags: docker_network_recover
