---

- name: create directories
  ansible.builtin.file:
    path: /mnt/external/gluster
    owner: root
    group: root
    state: directory
  when: inventory_hostname in groups['gluster_brick_servers']

- name: create configuration directory
  ansible.builtin.file:
    path: /etc/systemd/system/glusterd.service.d
    owner: root
    group: root
    state: directory

- name: configure
  ansible.builtin.copy:
    dest: /etc/systemd/system/glusterd.service.d/override.conf
    content: |
      {% if inventory_hostname in groups['gluster_brick_servers'] %}
      [Unit]
      RequiresMountsFor=/mnt/external/gluster

      {% endif %}
      [Service]
      ExecStartPre=/bin/sleep 30
  notify: gluster_server_restart
  tags: gluster_server_configure

- name: install
  ansible.builtin.apt:
    name: glusterfs-server
  notify: gluster_server_restart

- name: install gstatus
  ansible.builtin.shell:
    cmd: |
      curl -fsSL https://github.com/gluster/gstatus/releases/download/v1.0.8/gstatus -o /tmp/gstatus
      install /tmp/gstatus /usr/bin/gstatus
    creates: /usr/bin/gstatus
  tags: gstatus

- name: enable
  ansible.builtin.systemd:
    name: glusterd.service
    enabled: true

- name: set gluster peers
  gluster.gluster.gluster_peer:
    nodes: "{{ groups['gluster_pool_servers']|map('extract', hostvars, 'gluster_ip')|list }}"
  when: inventory_hostname in groups['gluster_management_server']
  tags: gluster_peers

- name: create gluster volume
  gluster.gluster.gluster_volume:
    state: present
    name: gv0
    brick: /mnt/external/gluster
    cluster: "{{ groups['gluster_brick_servers']|map('extract', hostvars, 'gluster_ip')|list }}"
    replicas: 3
    options:
      cluster.server-quorum-ratio: '51'
      cluster.server-quorum-type: server
      cluster.quorum-type: auto
  when: inventory_hostname in groups['gluster_management_server']

- name: start gluster volume
  gluster.gluster.gluster_volume:
    state: started
    name: gv0
  when: inventory_hostname in groups['gluster_management_server']

- name: get gluster volume config
  ansible.builtin.shell:
    cmd: gluster volume get gv0 features.bitrot
  register: gluster_volume_config
  changed_when: false
  when: inventory_hostname in groups['gluster_management_server']

- name: enable gluster volume bitrot
  ansible.builtin.shell:
    cmd: gluster volume bitrot gv0 enable
  when: >
    inventory_hostname in groups['gluster_management_server']
    and gluster_volume_config.stdout is not search('features\.bitrot\s+on')

- name: get glusterfs version and architecture for patched bitd
  ansible.builtin.command:
    cmd: dpkg-query -W -f=${Version}\ ${Architecture} glusterfs-common
  register: gluster_bitd_glusterfs_package
  changed_when: false
  check_mode: false
  when: inventory_hostname in groups['gluster_brick_servers']
  tags: gluster_server_bitd

- name: get stock bitd path
  ansible.builtin.command:
    cmd: dpkg -L glusterfs-common
  register: gluster_bitd_glusterfs_files
  changed_when: false
  check_mode: false
  when: inventory_hostname in groups['gluster_brick_servers']
  tags: gluster_server_bitd

- name: set patched bitd facts
  ansible.builtin.set_fact:
    gluster_bitd_glusterfs_version: "{{ gluster_bitd_glusterfs_package.stdout.split(' ')[0] }}"
    gluster_bitd_architecture: "{{ gluster_bitd_glusterfs_package.stdout.split(' ')[1] }}"
    gluster_bitd_path: "{{ gluster_bitd_glusterfs_files.stdout_lines | select('search', '/xlator/features/bit-rot\\.so$') | list }}"
  when: inventory_hostname in groups['gluster_brick_servers']
  tags: gluster_server_bitd

- name: require the glusterfs version and architecture the patched bitd is built for
  ansible.builtin.assert:
    that:
      - gluster_bitd_glusterfs_version == '10.3-5'
      - gluster_bitd_architecture in ['amd64', 'arm64']
      - gluster_bitd_path | length == 1
    fail_msg: "patched bit-rot.so is built from glusterfs 10.3-5 for amd64 and arm64, found {{ gluster_bitd_glusterfs_package.stdout }} with {{ gluster_bitd_path }}"
  when: inventory_hostname in groups['gluster_brick_servers']
  tags: gluster_server_bitd

- name: hold glusterfs packages for patched bitd
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - glusterfs-cli
    - glusterfs-client
    - glusterfs-common
    - glusterfs-server
    - libgfapi0
    - libgfchangelog0
    - libgfrpc0
    - libgfxdr0
    - libglusterd0
    - libglusterfs0
  when: inventory_hostname in groups['gluster_brick_servers']
  tags: gluster_server_bitd

- name: build patched bitd
  ansible.builtin.command:
    cmd: docker build --platform linux/amd64,linux/arm64 --output type=local,dest={{ role_path }}/dist {{ role_path }}/bitd
  changed_when: false
  check_mode: false
  delegate_to: localhost
  run_once: true
  tags: gluster_server_bitd

- name: divert stock bitd
  community.general.dpkg_divert:
    path: "{{ gluster_bitd_path | first }}"
    divert: "{{ gluster_bitd_path | first }}.distrib"
    rename: true
  when: inventory_hostname in groups['gluster_brick_servers']
  tags: gluster_server_bitd

- name: install patched bitd
  ansible.builtin.copy:
    dest: "{{ gluster_bitd_path | first }}"
    src: "{{ role_path }}/dist/linux_{{ gluster_bitd_architecture }}/bit-rot.so"
    owner: root
    group: root
    mode: u=rw,g=r,o=r
  when: inventory_hostname in groups['gluster_brick_servers']
  notify: gluster_server_bitd_restart
  tags: gluster_server_bitd

- name: enable logging
  ansible.builtin.systemd:
    name: gluster-log@{{ item }}
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - bitd
    - glusterd
    - glustershd
    - scrub
  notify: gluster_server_logging_restart
  tags: gluster_logging

- name: create gluster recover script
  ansible.builtin.copy:
    dest: /opt/gluster-recover.sh
    src: gluster-recover.sh
    owner: root
    group: root
    mode: u=rwx,g=rx,o=rx
  notify: gluster_recover_reload
  tags: gluster_recover

- name: configure gluster recover service
  ansible.builtin.copy:
    dest: /etc/systemd/system/gluster-recover.service
    content: |
      [Unit]
      Description=Gluster Volume Recovery
      After=glusterd.service
      Requires=glusterd.service

      [Service]
      Type=oneshot
      ExecStart=/opt/gluster-recover.sh
  notify: gluster_recover_reload
  tags: gluster_recover

- name: configure gluster recover timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/gluster-recover.timer
    content: |
      [Unit]
      Description=Gluster Volume Recovery

      [Timer]
      OnCalendar=*-*-* *:{{ gluster_recover_offset_minutes }}:00
      RandomizedDelaySec=60s
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: gluster_recover_reload
  tags: gluster_recover

- name: enable gluster recover timer
  ansible.builtin.systemd:
    name: gluster-recover.timer
    enabled: true
    state: started
  tags: gluster_recover

- name: configure gluster scrub service
  ansible.builtin.copy:
    dest: /etc/systemd/system/gluster-scrub.service
    content: |
      [Unit]
      Description=Gluster Volume Scrub
      After=glusterd.service
      Requires=glusterd.service

      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/gluster volume bitrot gv0 scrub ondemand
  when: inventory_hostname in groups['gluster_management_server']
  notify: gluster_scrub_reload
  tags: gluster_scrub

- name: configure gluster scrub timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/gluster-scrub.timer
    content: |
      [Unit]
      Description=Gluster Volume Scrub

      [Timer]
      OnCalendar=Sun *-*-01..07 10:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target
  when: inventory_hostname in groups['gluster_management_server']
  notify: gluster_scrub_reload
  tags: gluster_scrub

- name: enable gluster scrub timer
  ansible.builtin.systemd:
    name: gluster-scrub.timer
    enabled: true
    state: started
    daemon_reload: true
  when: inventory_hostname in groups['gluster_management_server']
  tags: gluster_scrub
